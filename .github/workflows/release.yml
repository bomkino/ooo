# Publishes OOO.dmg to a GitHub release when a version tag (v0.1.0, …) is pushed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Package the app
        run: OOO_VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-app.sh release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/OOO.dmg \
            --title "OOO $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
