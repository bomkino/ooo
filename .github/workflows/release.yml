# Publishes an OOO release from CI, run by hand from the Actions tab on main:
# the disk image, the ZIP, checksums, notes and the update feed, signed with
# pitch.dog's update key, marked Latest. Installed copies are offered the new
# version as soon as it is out; the last step proves it with a real copy of
# the release before it.
#
# The key is the SPARKLE_PRIVATE_KEY secret of the `release` environment,
# which only main may use (docs/UPDATES.md). It is written to a file only the
# runner can read, used by Sparkle's generate_appcast, and deleted.
#
# "Sign" (a version like v1.0.0) signs the update of a release that is already
# out instead, without rebuilding it.
name: release

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Only sign the update of a release that is already out (like v1.0.0). Leave empty to publish a new release.
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.sign == '' }}
    runs-on: macos-26
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only a new, higher version is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF_NAME" = main ] || { echo "::error::Run this on main."; exit 1; }
          VERSION="$(sed -n 's/^VERSION="\${VERSION_OVERRIDE:-\(.*\)}"$/\1/p' scripts/build-app.sh)"
          [ -n "$VERSION" ] || { echo "::error::No version in scripts/build-app.sh"; exit 1; }
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION is published already. Raise VERSION in scripts/build-app.sh."; exit 1
          fi
          LATEST="$(gh release list -R "$GITHUB_REPOSITORY" --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          build() { echo "$1" | awk -F. '{ printf "%d", $1 * 10000 + $2 * 100 + $3 }'; }
          if [ -n "$LATEST" ] && [ "$(build "$VERSION")" -le "$(build "${LATEST#v}")" ]; then
            echo "::error::$VERSION isn't newer than the Latest release, $LATEST."; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"
          echo "Publishing $VERSION after ${LATEST:-nothing}"
      - name: Get Sparkle's tools and the update key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::The release environment has no SPARKLE_PRIVATE_KEY secret. docs/UPDATES.md has the one-time command that sets it."; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]' > "$RUNNER_TEMP/update.key"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY=$RUNNER_TEMP/update.key" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Package the app
        run: bash scripts/build-app.sh release
      - name: Test in-app updates (packed and signed by the release scripts, with a throwaway key)
        timeout-minutes: 10
        run: bash scripts/test-update.sh
      - name: Pack the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/OOO.app/Contents/Info.plist)" = "$VERSION" ] \
            || { echo "::error::OOO.app isn't $VERSION"; exit 1; }
          KEY="$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" dist/OOO.app/Contents/Info.plist)"
          [ "$KEY" = "P43E8I+FgVyAW3QkS4J9bnDRRhAnsS4y3dT2WDce1lQ=" ] || { echo "::error::OOO.app doesn't trust pitch.dog's update key"; exit 1; }
          bash scripts/make-release.sh release
          # The feed: this release's ZIP, signed, and checked with the key inside the app.
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" bash scripts/sign-release.sh --dir release
          rm -f "$SPARKLE_KEY"
          # The release notes, in the shape of Drift's, Galileo's and Backdrop's:
          # the changelog section's opening line, what's new, how to install,
          # the files, what was checked, the source and the checksums.
          awk -v v="## $VERSION" 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > changes.md
          [ -s changes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          LEAD="$(awk 'NF { print; exit }' changes.md)"
          {
            echo "**$LEAD**"
            echo
            echo "### What's new"
            awk 'NF && !seen { seen = 1; next } seen' changes.md
            echo
            sed -e "s/@VERSION@/$VERSION/g" <<'NOTES'
          ### Install

          1. Download `OOO-@VERSION@-macOS-arm64.dmg`, open it, and drag OOO onto **Applications**. If macOS offers to install it for you and then says "Could not install", click OK and drag it instead. (That route only works for apps notarized by Apple.) `OOO-@VERSION@-macOS-arm64.zip` is the same app, if you'd rather unzip it.
          2. The first time you open it, macOS stops it. Open **System Settings › Privacy & Security**, scroll down, and click **Open Anyway**. (Control-click › Open no longer works on current macOS.)

          It needs an Apple silicon Mac with macOS 14 or later. OOO is free and open source, signed ad hoc and not notarized. If you have OOO 0.2.0 or later, it offers this version itself (**OOO › Check for Updates…**), within a day or at once from that menu.

          ### Files

          - `OOO-@VERSION@-macOS-arm64.dmg`: the app, to install by hand.
          - `OOO-@VERSION@-macOS-arm64.zip`: the same app; the in-app updater uses this one.
          - `appcast.xml`: the update feed installed copies read.
          - `SHA256SUMS.txt`: checksums.

          ### Checked

          Built from this commit by `release.yml` on GitHub's macOS 26 runner (Apple silicon). The unit tests pass: the camera's maths, the director, documents and the renderer. In `scripts/test-update.sh`, a test copy packed and signed by the release scripts updated itself from a local feed and relaunched on the new version, and an update with a single changed byte was refused. The update feed was signed by this workflow, and the signature checked with the public key inside the app.
          NOTES
            echo
            echo "Source: \`$GITHUB_SHA\` (main)."
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > notes.md
          cat notes.md
          ls -l release
      - name: Publish the release, marked Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --latest \
            --title "OOO $VERSION — Apple silicon Mac" --notes-file notes.md
          for _ in $(seq 24); do
            FEED="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" || true)"
            if grep -Eq "shortVersionString(>|=\")${VERSION}[<\"]" <<< "$FEED"; then
              echo "The feed offers $VERSION: installed copies will update to it."
              exit 0
            fi
            sleep 5
          done
          echo "::error::releases/latest/download/appcast.xml doesn't offer $VERSION"; exit 1
      - name: Update a copy of the release before from the live feed
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test-live-update.sh
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/update.key"

  sign:
    if: ${{ inputs.sign != '' }}
    runs-on: macos-26
    environment: release
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.sign }}
    steps:
      - uses: actions/checkout@v4
      - name: On main only
        run: '[ "$GITHUB_REF_NAME" = main ] || { echo "::error::Run this on main."; exit 1; }'
      - name: Get Sparkle's tools and the update key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::The release environment has no SPARKLE_PRIVATE_KEY secret. docs/UPDATES.md has the one-time command that sets it."; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]' > "$RUNNER_TEMP/update.key"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY=$RUNNER_TEMP/update.key" >> "$GITHUB_ENV"
      - name: Sign the release's update
        run: |
          bash scripts/sign-release.sh "$TAG"
          rm -f "$SPARKLE_KEY"
      - name: Update a copy of the release before from the live feed
        timeout-minutes: 10
        run: bash scripts/test-live-update.sh
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/update.key"
